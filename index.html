
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolam Drawing Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>✿ Kolam Drawing Studio ✿</h1>
    <p>Create beautiful traditional kolams with your own designs</p>
</header>

<main class="container">

    <!-- DOT CUSTOMIZATION -->
    <section class="controls">

        <h2>Customize Dot Pattern</h2>

        <label for="dotRows">Number of Rows</label>
        <input type="number" id="dotRows" min="1" max="30" value="5">

        <label for="dotColumns">Number of Columns</label>
        <input type="number" id="dotColumns" min="1" max="30" value="5">

        <label for="dotPattern">Dot Arrangement</label>
        <select id="dotPattern">
            <option value="square">Square Grid</option>
            <option value="rectangle">Rectangle Grid</option>
            <option value="diamond">Diamond</option>
            <option value="triangle">Triangle</option>
            <option value="inverted">Inverted Triangle</option>
            <option value="staggered">Staggered</option>
            <option value="random">Random Dots</option>
            <option value="custom">Custom Placement</option>
        </select>

        <label for="horizontalSpace">Horizontal Spacing</label>
        <input type="range" id="horizontalSpace"
               min="15" max="120" value="60">
        <span id="horizontalValue">60</span>

        <label for="verticalSpace">Vertical Spacing</label>
        <input type="range" id="verticalSpace"
               min="15" max="120" value="60">
        <span id="verticalValue">60</span>

        <label for="dotSize">Dot Size</label>
        <input type="range" id="dotSize"
               min="2" max="15" value="6">
        <span id="dotSizeValue">6</span>

        <label for="dotColor">Dot Colour</label>
        <input type="color" id="dotColor" value="#222222">

        <button id="generateBtn" class="primary">
            Generate Dots
        </button>

        <hr>

        <!-- DRAWING TOOLS -->
        <h2>Drawing Tools</h2>

        <div class="tool-buttons">
            <button id="drawBtn" class="active">✏ Free Draw</button>
            <button id="straightBtn">／ Straight Line</button>
            <button id="curveBtn">⌒ Curve Line</button>
            <button id="fillBtn">🪣 Fill Colour</button>
            <button id="placeBtn">＋ Place Dots</button>
            <button id="eraseBtn">⌫ Eraser</button>
            <button id="eraseDotBtn">● Erase Dots</button>
            <button id="undoBtn">↶ Undo</button>
            <button id="clearBtn">Clear Drawing</button>
        </div>

        <label for="lineColor">Line Colour</label>
        <input type="color" id="lineColor" value="#222222">

        <label for="fillColor">Fill Colour</label>
        <input type="color" id="fillColor" value="#ff4081">

        <label for="bgColor">Background Colour</label>
        <input type="color" id="bgColor" value="#ffffff">

        <label for="brushSize">Brush Size</label>
        <input type="range" id="brushSize"
               min="1" max="20" value="4">
        <span id="brushValue">4</span>

        <button id="resetBtn">Reset Everything</button>

    </section>

    <!-- DRAWING CANVAS -->
    <section class="drawing-section">

        <h2>Your Kolam Canvas</h2>

        <p id="modeText">
            Select a tool and start drawing.
        </p>

        <div class="canvas-container">
            <canvas id="kolamCanvas"
                    width="800" height="800">
            </canvas>
        </div>

        <div class="bottom-buttons">
            <button id="saveBtn" class="primary">
                ⬇ Download Kolam
            </button>
        </div>

        <p id="status">Ready to create your kolam!</p>

    </section>

</main>

<footer>
    <p>Made with ❤️ for Kolam Lovers</p>
</footer>

<script src="script.js"></script>

</body>
</html>
